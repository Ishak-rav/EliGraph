# Replace YOUR_DOMAIN with your actual domain (e.g. eligraph.eliadis.fr)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # MCP endpoint — proxy to eligraph container
    location /mcp {
        proxy_pass         http://eligraph:3000/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for MCP Streamable HTTP (SSE upgrade)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Health check passthrough (used by monitoring)
    location /healthz {
        proxy_pass http://eligraph:3000/healthz;
    }
}

# Needed for WebSocket/SSE upgrade header handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
