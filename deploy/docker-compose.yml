services:
  eligraph:
    image: ghcr.io/ishak-rav/eligraph:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - logs:/var/log/eligraph
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/eligraph.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      - eligraph

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Auto-renew every 12h
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'

networks:
  internal:
    driver: bridge

volumes:
  logs:
  certbot-certs:
  certbot-www:
